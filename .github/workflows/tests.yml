# A backup check on GitHub's machines when a version branch (v0.2.0, …) is pushed: the
# typecheck, every test (in California time and UTC), and the production build of the page (the
# one the always-on app serves, so a build that fails shows here, not at app:restart).
# Mutation testing and the click-through (npm run qa:check) run on the Mac.
# Tests use made-up data only and never reach Nexon.
name: Tests

on:
  push:
    branches: ["v*"]
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Typecheck, tests (California time and UTC) and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
